# Local development database. Start it with: docker compose up -d
# These credentials are for local development only; the NUC deployment gets its own secrets later.
services:
  postgres:
    image: postgres:17
    container_name: productscraper-db
    environment:
      POSTGRES_DB: productscraper
      POSTGRES_USER: productscraper
      POSTGRES_PASSWORD: productscraper
    ports:
      - "5432:5432"
    volumes:
      # Named volume: the data survives container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productscraper -d productscraper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
