spring:
  application:
    name: product-scraper
  datasource:
    # Defaults match compose.yaml (local development). Override with environment variables elsewhere.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productscraper}
    username: ${DB_USER:productscraper}
    password: ${DB_PASSWORD:productscraper}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it (never changes it)
      ddl-auto: validate
  # Flyway runs the scripts in db/migration automatically when the application starts
